name: Build and release Windows EXE

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (defaults to nightly-<run number> if left blank)'
        required: false
        type: string
      publish:
        description: 'Publish a public GitHub Release (uncheck to only build the .exe as a private workflow artifact, e.g. for a one-off verification build)'
        required: false
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Package Windows executable
        run: npm run dist:win

      - name: Upload .exe as a workflow artifact (always — private, downloadable from this run's page by repo collaborators, independent of whether a public release is also published)
        uses: actions/upload-artifact@v4
        with:
          name: ANAMNESIS-windows-exe
          path: release/*.exe
          retention-days: 14

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [[ -n "${{ inputs.tag_name }}" ]]; then
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=nightly-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        # Tag pushes always publish (the documented v* release flow); a manual
        # workflow_dispatch run publishes unless `publish` is explicitly
        # unchecked, so an ad hoc verification build can skip going public.
        if: github.event_name == 'push' || inputs.publish != false
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ANAMNESIS ${{ steps.tag.outputs.tag }}
          files: release/*.exe
          draft: false
          prerelease: false
